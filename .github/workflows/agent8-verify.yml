name: Agent 8 verify

# Offline unit + cross-system checks only: no Gemini key, no SpacetimeDB, no camera.
# The live path (./test-all.sh --live) is run by hand against a local stack.

on:
  push:
  pull_request:

jobs:
  fixture-integration:
    name: Cross-system checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests/
        run: npm test

  modules:
    name: Module tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [data, capture, vision, analytics, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: ${{ matrix.module }}
        run: npm ci
      - name: Test
        working-directory: ${{ matrix.module }}
        run: npm test

  spacetimedb-module:
    name: SpacetimeDB module typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: db/spacetimedb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
